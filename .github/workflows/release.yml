name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ccsamsterdam
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend/caddy image
        uses: docker/build-push-action@v6
        with:
          context: web/frontend
          push: true
          tags: |
            ccsamsterdam/jatsmith-caddy:${{ steps.version.outputs.version }}
            ccsamsterdam/jatsmith-caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/backend/Dockerfile
          push: true
          tags: |
            ccsamsterdam/jatsmith-api:${{ steps.version.outputs.version }}
            ccsamsterdam/jatsmith-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Prepare release assets
        # Bundle the deploy files into a single tar.gz so the README quick-start
        # can stream-extract them with `wget -qO- ... | tar xz` (no temp file
        # to clean up). The leading dot on .env is preserved inside the archive
        # — GitHub release uploads strip leading dots from filenames, which
        # is why we don't ship .env as a separate asset.
        run: |
          cp deploy/.env.example deploy/.env
          tar -czf jatsmith-deploy.tar.gz -C deploy \
            docker-compose.yml .env update.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: jatsmith-deploy.tar.gz
          generate_release_notes: true
