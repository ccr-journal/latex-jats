services:
  caddy:
    image: ccsamsterdam/jatsmith-caddy:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Default to plain HTTP for the local-trial case so Caddy doesn't try to
      # mint a local-CA cert. Override in .env with a bare hostname (e.g.
      # `jats.example.com`) for production — Caddy then handles TLS.
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ccsamsterdam/jatsmith-api:${VERSION:-latest}
    restart: unless-stopped
    env_file:
      - .env  # EDITOR_CREDENTIALS, OJS_*, SITE_ADDRESS, etc. — see .env.example
    environment:
      - CORS_ORIGINS=
      - STORAGE_DIR=/app/storage
    volumes:
      - app_storage:/app/storage

volumes:
  caddy_data:
  caddy_config:
  app_storage:
